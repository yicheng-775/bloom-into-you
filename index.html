<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>花开成你</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ====== CSS Reset & Variables ====== */
:root {
  --cream: #fdf6ed;
  --paper: #f9f2e7;
  --text: #3d2f2f;
  --text-light: #6b5a5a;
  --gold: #c9a96e;
  --gold-light: #e0c78a;
  --rose: #d4a0a0;
  --rose-light: #eac9c9;
  --sage: #a3b5a6;
  --sage-light: #c5d3c7;
  --lavender: #b8a9c9;
  --lavender-light: #d4c9e0;
  --sky: #a8c4d4;
  --sky-light: #c9dce8;
  --blush: #e8c5c5;
  --mint: #b5cdc4;
  --shadow: 0 2px 20px rgba(60,40,30,0.08);
  --shadow-lg: 0 8px 40px rgba(60,40,30,0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'SimSun', serif;
  --font-sans: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --transition: 0.5s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--cream);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ====== Watercolor Background ====== */
.watercolor-bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(232,197,197,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 80% 30%, rgba(184,169,201,0.3) 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 70%, rgba(163,181,166,0.3) 0%, transparent 55%),
    radial-gradient(ellipse 90% 60% at 70% 80%, rgba(232,202,137,0.25) 0%, transparent 50%),
    radial-gradient(ellipse 50% 80% at 30% 60%, rgba(197,211,199,0.3) 0%, transparent 50%),
    var(--paper);
}
.paper-texture {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ====== Petal Animation ====== */
.petals-container { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
.petal {
  position: absolute; top: -5%;
  animation: petalFall var(--dur) var(--delay) linear infinite;
  opacity: 0;
  font-size: var(--size);
  filter: blur(0.5px);
}
@keyframes petalFall {
  0% { transform: translateY(-5vh) rotate(0deg) translateX(0); opacity: 0; }
  5% { opacity: 0.5; }
  80% { opacity: 0.4; }
  100% { transform: translateY(105vh) rotate(var(--rot)) translateX(var(--drift)); opacity: 0; }
}

/* ====== Main Container ====== */
.app-container {
  max-width: 520px; margin: 0 auto; padding: 20px 24px;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
}

/* ====== Page System ====== */
.page { display: none; width: 100%; }
.page.active { display: block; animation: pageIn 0.6s var(--transition); }
@keyframes pageIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* ====== Page 1: Home ====== */
.home-content { text-align: center; }
.home-logo {
  font-family: var(--font-serif); font-size: 3.2rem;
  background: linear-gradient(135deg, #c9a96e, #d4a0a0, #a3b5a6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px; letter-spacing: 4px;
}
.home-subtitle { color: var(--text-light); font-size: 1.05rem; margin-bottom: 36px; letter-spacing: 2px; }
.home-flowers { font-size: 3rem; margin-bottom: 24px; letter-spacing: 6px; animation: sway 3s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }

.btn-start {
  display: inline-block; padding: 16px 56px;
  background: linear-gradient(135deg, var(--gold), #b8955a);
  color: #fff; border: none; border-radius: 50px;
  font-size: 1.15rem; font-family: var(--font-serif);
  letter-spacing: 3px; cursor: pointer;
  box-shadow: 0 4px 24px rgba(201,169,110,0.35);
  transition: all 0.3s;
  text-decoration: none;
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(201,169,110,0.5); }
.btn-start:active { transform: scale(0.97); }

.home-footer { margin-top: 48px; color: var(--text-light); font-size: 0.85rem; opacity: 0.6; }

/* ====== Page 2: Test ====== */
.test-header { margin-bottom: 24px; }
.progress-bar-outer {
  width: 100%; height: 6px; background: rgba(0,0,0,0.06); border-radius: 99px; overflow: hidden;
}
.progress-bar-inner {
  height: 100%; background: linear-gradient(90deg, var(--sage), var(--gold), var(--rose));
  border-radius: 99px; transition: width 0.4s ease;
  width: 0%;
}
.progress-text { text-align: right; color: var(--text-light); font-size: 0.85rem; margin-top: 6px; }

.question-card {
  background: rgba(255,255,255,0.55); backdrop-filter: blur(16px);
  border-radius: var(--radius); padding: 28px 24px;
  box-shadow: var(--shadow); margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.6);
}
.question-number { color: var(--gold); font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 8px; }
.question-text { font-family: var(--font-serif); font-size: 1.2rem; line-height: 1.7; margin-bottom: 24px; }
.options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  display: block; width: 100%; padding: 15px 20px; text-align: left;
  background: rgba(255,255,255,0.6); border: 1.5px solid rgba(0,0,0,0.06);
  border-radius: var(--radius-sm); cursor: pointer; font-size: 0.98rem;
  transition: all 0.25s; color: var(--text);
  font-family: var(--font-sans);
}
.option-btn:hover {
  background: rgba(255,255,255,0.85);
  border-color: var(--gold-light);
  transform: translateX(3px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.option-btn:active { transform: scale(0.98); }
.option-btn.chosen {
  background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(212,160,160,0.15));
  border-color: var(--gold);
  box-shadow: 0 2px 16px rgba(201,169,110,0.2);
}
.option-label { color: var(--gold); font-weight: 600; margin-right: 8px; }

/* Test navigation */
.test-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.btn-back {
  padding: 10px 20px; background: rgba(255,255,255,0.4);
  border: 1px solid rgba(0,0,0,0.06); border-radius: 50px;
  cursor: pointer; font-size: 0.9rem; color: var(--text-light);
  font-family: var(--font-sans); transition: all 0.25s;
}
.btn-back:hover { background: rgba(255,255,255,0.7); border-color: rgba(0,0,0,0.12); }
.btn-back:active { transform: scale(0.96); }

/* ====== Page 3: Generating ====== */
.generating-content { text-align: center; }
.seed-container { position: relative; width: 120px; height: 120px; margin: 0 auto 32px; }
.seed {
  width: 40px; height: 40px; background: radial-gradient(circle, #8b7355, #5c4033);
  border-radius: 50% 50% 40% 60%;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  animation: seedBounce 0.6s ease-in-out infinite;
}
.seed-ring { position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(201,169,110,0.3); animation: seedPulse 1.5s ease-in-out infinite; }
.seed-ring:nth-child(2) { inset: -20px; animation-delay: 0.5s; }
@keyframes seedBounce { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }
@keyframes seedPulse { 0%,100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }

.generating-text { font-family: var(--font-serif); font-size: 1.2rem; color: var(--text-light); letter-spacing: 1px; }
.generating-sub { font-size: 0.9rem; color: var(--text-light); opacity: 0.6; margin-top: 8px; }

/* ====== Page 4: Result ====== */
.result-header { text-align: center; margin-bottom: 28px; }
.result-garden-tag {
  display: inline-block; padding: 6px 20px;
  background: rgba(201,169,110,0.15); border-radius: 99px;
  font-size: 0.85rem; color: var(--gold); letter-spacing: 1px;
}
.result-flower-name {
  font-family: var(--font-serif); font-size: 2.4rem; margin: 12px 0 4px;
  letter-spacing: 3px;
}
.result-latin { font-style: italic; color: var(--text-light); font-size: 0.9rem; opacity: 0.7; }
.result-flower-emoji { font-size: 5rem; margin: 16px 0; animation: sway 3s ease-in-out infinite; }

/* Botany Card */
.botany-card {
  background: rgba(255,255,255,0.5); backdrop-filter: blur(12px);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.5);
}
.botany-title { font-family: var(--font-serif); font-size: 1rem; color: var(--gold); margin-bottom: 10px; letter-spacing: 1px; }
.botany-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.9rem; }
.botany-item { display: flex; gap: 6px; }
.botany-label { color: var(--text-light); white-space: nowrap; }
.botany-value { color: var(--text); }
.botany-fact { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(0,0,0,0.08); font-size: 0.88rem; color: var(--text-light); line-height: 1.6; }

/* Flower Language */
.flower-language {
  text-align: center; padding: 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(201,169,110,0.1), rgba(212,160,160,0.1));
  border-radius: var(--radius);
}
.flower-language-label { font-size: 0.85rem; color: var(--gold); letter-spacing: 2px; }
.flower-language-text { font-family: var(--font-serif); font-size: 1.5rem; margin-top: 6px; letter-spacing: 2px; }

/* Personality Poem */
.poem-card {
  background: rgba(255,255,255,0.5); backdrop-filter: blur(12px);
  border-radius: var(--radius); padding: 24px 20px;
  box-shadow: var(--shadow); margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.5);
}
.poem-title { font-family: var(--font-serif); font-size: 1rem; color: var(--gold); margin-bottom: 12px; letter-spacing: 1px; }
.poem-text { font-family: var(--font-serif); font-size: 1rem; line-height: 2; color: var(--text); }

/* Radar */
.radar-card { margin-bottom: 20px; text-align: center; }
.radar-title { font-family: var(--font-serif); font-size: 1rem; color: var(--gold); margin-bottom: 12px; letter-spacing: 1px; }
.radar-canvas { max-width: 380px; width: 100%; }

/* Advice */
.advice-card {
  background: linear-gradient(135deg, rgba(163,181,166,0.15), rgba(184,169,201,0.15));
  border-radius: var(--radius); padding: 20px;
  margin-bottom: 24px;
}
.advice-title { font-family: var(--font-serif); font-size: 1rem; color: var(--sage); margin-bottom: 10px; letter-spacing: 1px; }
.advice-text { font-family: var(--font-serif); font-size: 0.95rem; line-height: 1.8; color: var(--text); }

/* Action buttons */
.result-actions { display: flex; gap: 12px; margin-bottom: 32px; }
.btn-share, .btn-retest {
  flex: 1; padding: 14px 0; text-align: center; border-radius: 50px;
  font-family: var(--font-serif); font-size: 0.95rem; cursor: pointer;
  letter-spacing: 1px; transition: all 0.3s;
  border: none;
}
.btn-share {
  background: linear-gradient(135deg, var(--gold), #b8955a);
  color: #fff; box-shadow: 0 4px 20px rgba(201,169,110,0.3);
}
.btn-share:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(201,169,110,0.45); }
.btn-retest {
  background: rgba(255,255,255,0.5); color: var(--text);
  border: 1.5px solid rgba(0,0,0,0.08);
}
.btn-retest:hover { background: rgba(255,255,255,0.75); }

/* ====== Page 5: Poster ====== */
.poster-overlay {
  position: fixed; inset: 0; background: rgba(30,20,15,0.6);
  backdrop-filter: blur(8px); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.3s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.poster-card {
  background: #fdf8f0; border-radius: 24px; padding: 32px 28px;
  width: 90vw; max-width: 420px; text-align: center;
  box-shadow: 0 16px 60px rgba(0,0,0,0.25);
  position: relative;
  background-image:
    radial-gradient(ellipse 60% 40% at 30% 20%, rgba(210,180,160,0.2) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 70% 80%, rgba(180,200,180,0.2) 0%, transparent 50%);
}
.poster-close {
  position: absolute; top: 12px; right: 16px;
  background: none; border: none; font-size: 1.3rem; cursor: pointer;
  color: var(--text-light); padding: 4px 8px;
}
.poster-flower { font-size: 4rem; margin-bottom: 8px; }
.poster-name { font-family: var(--font-serif); font-size: 2rem; letter-spacing: 3px; margin-bottom: 4px; }
.poster-garden { font-size: 0.85rem; color: var(--gold); letter-spacing: 1px; margin-bottom: 12px; }
.poster-divider { width: 40px; height: 2px; background: var(--gold-light); margin: 0 auto 12px; }
.poster-language { font-family: var(--font-serif); font-size: 1.2rem; color: var(--text); letter-spacing: 2px; margin-bottom: 16px; }
.poster-quote { font-size: 0.9rem; color: var(--text-light); line-height: 1.7; font-family: var(--font-serif); margin-bottom: 20px; }
.poster-brand { font-size: 0.8rem; color: var(--text-light); opacity: 0.5; letter-spacing: 1px; }
.poster-actions { display: flex; gap: 10px; margin-top: 16px; }
.poster-actions button {
  flex: 1; padding: 10px 16px; border-radius: 50px; cursor: pointer;
  font-family: var(--font-sans); font-size: 0.9rem; transition: all 0.3s;
}
.poster-btn-save {
  background: linear-gradient(135deg, var(--gold), #b8955a);
  color: #fff; border: none;
}
.poster-btn-save:hover { opacity: 0.9; }
.poster-btn-cancel {
  background: transparent; border: 1px solid rgba(0,0,0,0.1); color: var(--text-light);
}
.poster-btn-cancel:hover { background: rgba(0,0,0,0.03); }

/* ====== Responsive ====== */
@media (max-width: 420px) {
  .home-logo { font-size: 2.4rem; }
  .question-text { font-size: 1.08rem; }
  .result-flower-name { font-size: 1.8rem; }
  .poster-card { padding: 24px 18px; }
}
</style>
</head>
<body>

<div class="watercolor-bg"></div>
<div class="paper-texture"></div>
<div class="petals-container" id="petalsContainer"></div>

<div class="app-container">

  <!-- ====== Page 1: Home ====== -->
  <section class="page active" id="page-home">
    <div class="home-content">
      <div class="home-flowers">🌸🌿🌺🌿🌸</div>
      <h1 class="home-logo">花开成你</h1>
      <p class="home-subtitle">你是一朵怎样的花？</p>
      <button class="btn-start" onclick="startTest()">开 始 探 索</button>
      <p class="home-footer">基于大五人格模型 · 30题深度版 · 3~5分钟<br><span style="opacity:0.5;font-size:0.75rem;">v2.1 — 加权概率匹配</span></p>
    </div>
  </section>

  <!-- ====== Page 2: Test ====== -->
  <section class="page" id="page-test">
    <div class="test-header">
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
      <p class="progress-text" id="progressText">1 / 30</p>
    </div>
    <div class="question-card" id="questionCard">
      <p class="question-number" id="qNumber">Q1</p>
      <p class="question-text" id="qText"></p>
      <div class="options-list" id="optionsList"></div>
    </div>
    <div class="test-nav" id="testNav">
      <button class="btn-back" id="btnBack" onclick="goBack()" style="display:none;">← 上一题</button>
      <span></span>
    </div>
  </section>

  <!-- ====== Page 3: Generating ====== -->
  <section class="page" id="page-generating">
    <div class="generating-content">
      <div class="seed-container">
        <div class="seed-ring"></div>
        <div class="seed-ring"></div>
        <div class="seed"></div>
      </div>
      <p class="generating-text">正在寻找属于你的花朵……</p>
      <p class="generating-sub">种子正在土壤中苏醒</p>
    </div>
  </section>

  <!-- ====== Page 4: Result ====== -->
  <section class="page" id="page-result">
    <div id="resultContent"></div>
  </section>

</div>

<!-- ====== Page 5: Poster (overlay, outside app container) ====== -->
<div id="posterOverlay" class="poster-overlay" style="display:none;">
  <div class="poster-card" id="posterCard">
    <button class="poster-close" onclick="closePoster()">✕</button>
    <div id="posterContent"></div>
  </div>
</div>

<script>
// ====== PETAL ANIMATION ======
(function createPetals() {
  const container = document.getElementById('petalsContainer');
  const petalChars = ['🌸','🌺','💮','🌷','🌼','✿','❀','🌿'];
  for (let i = 0; i < 18; i++) {
    const petal = document.createElement('span');
    petal.className = 'petal';
    petal.textContent = petalChars[i % petalChars.length];
    petal.style.cssText = `
      left: ${Math.random() * 95}%;
      --dur: ${12 + Math.random() * 20}s;
      --delay: -${Math.random() * 20}s;
      --size: ${0.8 + Math.random() * 1.6}rem;
      --rot: ${360 + Math.random() * 720}deg;
      --drift: ${-60 + Math.random() * 120}px;
    `;
    container.appendChild(petal);
  }
})();

// ====== APP STATE ======
const TOTAL_QUESTIONS = 30;
let currentQuestion = 0;
let answers = [];       // [{optionIndex, weights: [O,C,E,A,N]}]
let scores = [0,0,0,0,0]; // accumulated raw [O,C,E,A,N]
let matchedFlower = null;

// ====== PAGE ROUTER ======
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page-' + pageId);
  if (page) page.classList.add('active');
}

// ====== START TEST ======
function startTest() {
  currentQuestion = 0;
  answers = new Array(TOTAL_QUESTIONS).fill(undefined);
  scores = [0,0,0,0,0];
  matchedFlower = null;
  showPage('test');
  renderQuestion(0);
}

// ====== RENDER QUESTION ======
function renderQuestion(index) {
  if (index >= TOTAL_QUESTIONS) {
    showGenerating();
    return;
  }
  currentQuestion = index;
  const q = questions[index];
  document.getElementById('qNumber').textContent = 'Q' + (index + 1);
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressText').textContent = (index + 1) + ' / ' + TOTAL_QUESTIONS;
  document.getElementById('progressBar').style.width = ((index / TOTAL_QUESTIONS) * 100) + '%';

  // Back button: show only if not on first question
  const backBtn = document.getElementById('btnBack');
  backBtn.style.display = index > 0 ? 'inline-block' : 'none';

  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  const prevAnswer = answers[index];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (prevAnswer !== undefined && prevAnswer.optionIndex === i) {
      btn.classList.add('chosen');
    }
    btn.innerHTML = '<span class="option-label">' + labels[i] + '</span>' + opt.text;
    btn.addEventListener('click', () => selectOption(i));
    list.appendChild(btn);
  });
}

// ====== GO BACK ======
function goBack() {
  if (currentQuestion <= 0) return;
  // The answer for the current question (if any) was already stored in answers[currentQuestion]
  // Simply go back one step — the user can change their answer when they re-select
  renderQuestion(currentQuestion - 1);
}

// ====== SELECT OPTION ======
function selectOption(optionIndex) {
  const q = questions[currentQuestion];
  const chosenWeights = q.options[optionIndex].weights;

  // If re-answering, subtract old weights first
  const prevAnswer = answers[currentQuestion];
  if (prevAnswer !== undefined) {
    for (let d = 0; d < 5; d++) scores[d] -= prevAnswer.weights[d];
  }

  // Store new answer
  answers[currentQuestion] = { qIndex: currentQuestion, optionIndex, weights: chosenWeights };
  for (let d = 0; d < 5; d++) scores[d] += chosenWeights[d];

  // Flash animation
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((b, i) => { b.classList.remove('chosen'); if (i === optionIndex) b.classList.add('chosen'); });

  setTimeout(() => {
    // If all 30 questions are answered, go to generating
    const allAnswered = answers.every(a => a !== undefined);
    if (allAnswered) {
      showGenerating();
    } else {
      renderQuestion(currentQuestion + 1);
    }
  }, 300);
}

// ====== SHOW GENERATING ======
function showGenerating() {
  showPage('generating');
  setTimeout(() => {
    matchedFlower = calculateResult();

// ====== CALCULATE RESULT ======
function calculateResult() {
  // Per-dimension normalization using actual min/max from all 30 questions
  const DIM_MAX = [45, 64, 57, 48, 44];  // O,C,E,A,N theoretical max
  const DIM_MIN = [-1, -8, -12, -4, -13]; // O,C,E,A,N theoretical min
  let normalized = scores.map((s, d) => {
    const range = DIM_MAX[d] - DIM_MIN[d];
    const clamped = Math.max(DIM_MIN[d], Math.min(DIM_MAX[d], s));
    return Math.round(((clamped - DIM_MIN[d]) / range) * 100);
  });
  // Amplify personality signals: push scores away from center (50)
  // so that small-but-real preferences produce visible differentiation
  const AMP = 1.3;
  normalized = normalized.map(s => Math.round(Math.max(0, Math.min(100, 50 + (s - 50) * AMP))));

  // Weighted probability sampling instead of deterministic closest-match.
  // This ensures: (a) consistent preferences → correct flower with high probability,
  // (b) random/indifferent answers → roughly even distribution across all flowers.
  const distances = flowers.map(f => {
    let dist = 0;
    for (let d = 0; d < 5; d++) dist += Math.pow(normalized[d] - f.coords[d], 2);
    return Math.sqrt(dist);
  });

  // Convert distance to weight: closer = higher weight
  // SMOOTH prevents division by zero; POWER controls how selective the matching is
  const SMOOTH = 6, POWER = 3;
  const weights = distances.map(d => Math.pow(1 / (d + SMOOTH), POWER));
  const totalWeight = weights.reduce((a, b) => a + b, 0);

  // Weighted random selection using cumulative comparison
  // (avoids floating-point edge cases from repeated subtraction)
  const roll = Math.random() * totalWeight;
  let cumulative = 0;
  let bestFlower = flowers[0];
  for (let i = 0; i < weights.length; i++) {
    cumulative += weights[i];
    if (roll < cumulative) { bestFlower = flowers[i]; break; }
  }

  bestFlower.userScores = normalized;
  return bestFlower;
}

// ====== RADAR CHART ======
function drawRadar(scores, labels, color) {
  const canvas = document.getElementById('radarCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(cx, cy) * 0.6;
  const N = 5;

  ctx.clearRect(0, 0, W, H);

  // Grid
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
      const r = (R / 4) * ring;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axis
  for (let i = 0; i < N; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.stroke();
  }

  // Data area
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
    const r = (scores[i] / 100) * R;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  grad.addColorStop(0, color + '30');
  grad.addColorStop(1, color + '08');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Data points
  for (let i = 0; i < N; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
    const r = (scores[i] / 100) * R;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Labels
  ctx.fillStyle = '#3d2f2f';
  ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i < N; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
    const labelR = R + 34;
    const x = cx + labelR * Math.cos(angle);
    const y = cy + labelR * Math.sin(angle) + 5;
    ctx.fillText(labels[i], x, y);
  }

  // Score labels
  ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
  for (let i = 0; i < N; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
    const r = (scores[i] / 100) * R;
    const scoreR = r - 16;
    const x = cx + scoreR * Math.cos(angle);
    const y = cy + scoreR * Math.sin(angle) + 4;
    ctx.fillStyle = color;
    ctx.fillText(scores[i], x, y);
  }
}

  `;

  document.getElementById('posterOverlay').style.display = 'flex';

function closePoster() {
  document.getElementById('posterOverlay').style.display = 'none';
}

function savePoster() {
  // Load html2canvas from CDN on demand
  if (typeof html2canvas === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = () => doSavePoster();
    document.head.appendChild(script);
  } else {
    doSavePoster();
  }
}

function doSavePoster() {
  const card = document.getElementById('posterCard');
  // Hide buttons for screenshot
  const actions = card.querySelector('.poster-actions');
  const closeBtn = card.querySelector('.poster-close');
  if (actions) actions.style.display = 'none';
  if (closeBtn) closeBtn.style.display = 'none';

  html2canvas(card, {
    backgroundColor: '#fdf8f0',
    scale: 2,
    useCORS: true,
  }).then(canvas => {
    if (actions) actions.style.display = '';
    if (closeBtn) closeBtn.style.display = '';
    const link = document.createElement('a');
    link.download = '花开成你_' + matchedFlower.name + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(() => {
    if (actions) actions.style.display = '';
    if (closeBtn) closeBtn.style.display = '';
    alert('海报生成失败，请重试');
  });
}
